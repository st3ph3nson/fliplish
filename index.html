<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>
<meta name="theme-color" content="#1976d2">
<title>Family Crossword</title>

<style>
:root {
  --blue: #1976d2;
  --blue-dark: #0d47a1;
  --blue-light: #72baff;
  --yellow: #ffd400;
  --black: #111111;
  --page: #f4f5f7;
  --card: #ffffff;
  --soft: #eef6ff;
  --text: #171717;
  --muted: #666666;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--page);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  color: var(--text);
  font-family:
    ui-rounded,
    "SF Pro Rounded",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at top left, rgba(114,186,255,.65) 0%, transparent 30rem),
    radial-gradient(circle at bottom right, rgba(255,212,0,.34) 0%, transparent 26rem),
    var(--page);
}

main {
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 24px 12px 50px;
}

.hero {
  margin-bottom: 18px;
}

.kicker {
  color: var(--blue-dark);
  font-size: .78rem;
  font-weight: 950;
  letter-spacing: .16em;
  text-transform: uppercase;
}

h1 {
  margin: 4px 0 4px;
  font-size: clamp(2.4rem, 8vw, 4.7rem);
  line-height: .95;
  letter-spacing: -.05em;
  color: var(--black);
}

.subtitle {
  margin: 8px 0 0;
  max-width: 680px;
  color: var(--muted);
  font-weight: 750;
  line-height: 1.5;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 18px;
  align-items: start;
}

.card {
  padding: 14px;
  border: 3px solid var(--black);
  border-radius: 22px;
  background: white;
  box-shadow: 0 5px 0 var(--black);
}

.game-card {
  min-width: 0;
}

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.score {
  padding: 7px 10px;
  border: 2px solid var(--black);
  border-radius: 10px;
  background: var(--yellow);
  font-size: .88rem;
  font-weight: 950;
}

.instructions {
  color: var(--muted);
  font-size: .86rem;
  font-weight: 750;
}

.grid-wrap {
  width: 100%;
  overflow-x: auto;
  padding-bottom: 2px;
}

#crossword {
  --cols: 13;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: 2px;
  width: min(100%, 650px);
  min-width: 420px;
  margin: 0 auto;
  padding: 7px;
  border: 3px solid var(--black);
  border-radius: 17px;
  background: var(--black);
}

.cell {
  position: relative;
  aspect-ratio: 1 / 1;
  min-width: 0;
  background: white;
}

.cell.block {
  background: var(--black);
}

.cell.correct {
  background: var(--yellow);
}

.cell.active {
  box-shadow: inset 0 0 0 4px var(--blue);
}

.number {
  position: absolute;
  top: 2px;
  left: 3px;
  z-index: 2;
  color: var(--black);
  font-size: clamp(7px, 1.4vw, 10px);
  font-weight: 950;
  line-height: 1;
  pointer-events: none;
}

.cell input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 7px 1px 1px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--black);
  text-align: center;
  text-transform: uppercase;
  font: inherit;
  font-size: clamp(.86rem, 3vw, 1.45rem);
  font-weight: 950;
  caret-color: var(--blue-dark);
}

.cell input:focus {
  outline: none;
}

.clues-card h2 {
  margin: 0 0 10px;
  font-size: 1.3rem;
}

.clue-section + .clue-section {
  margin-top: 18px;
}

.clue-title {
  margin-bottom: 8px;
  padding: 8px 10px;
  border: 2px solid var(--black);
  border-radius: 10px;
  background: var(--blue-light);
  font-size: .82rem;
  font-weight: 950;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.clue-list {
  display: grid;
  gap: 7px;
}

.clue {
  width: 100%;
  min-height: 44px;
  padding: 9px 10px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  border: 2px solid var(--black);
  border-radius: 11px;
  background: white;
  color: var(--black);
  box-shadow: 0 3px 0 var(--black);
  text-align: left;
  font: inherit;
  cursor: pointer;
}

.clue-number {
  flex: 0 0 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: var(--black);
  color: white;
  font-size: .74rem;
  font-weight: 950;
}

.clue-text {
  padding-top: 2px;
  font-size: .9rem;
  font-weight: 800;
  line-height: 1.3;
}

.clue.selected {
  background: var(--blue-light);
}

.clue.correct {
  background: var(--yellow);
}

.controls {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 14px;
}

button.action {
  min-height: 48px;
  padding: 0 16px;
  border: 3px solid var(--black);
  border-radius: 13px;
  background: white;
  color: var(--black);
  box-shadow: 0 4px 0 var(--black);
  font: inherit;
  font-weight: 950;
  cursor: pointer;
}

button.action.primary {
  background: var(--yellow);
}

button:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 var(--black);
}

#message {
  min-height: 24px;
  margin-top: 13px;
  color: var(--muted);
  font-size: .9rem;
  font-weight: 850;
}

#message.good {
  color: var(--blue-dark);
}

.win {
  display: none;
  margin-top: 13px;
  padding: 15px;
  border: 3px solid var(--black);
  border-radius: 14px;
  background: var(--yellow);
  box-shadow: 0 4px 0 var(--black);
  text-align: center;
  font-weight: 950;
}

.win.show {
  display: block;
}

@media (max-width: 850px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .clues-card {
    order: 2;
  }
}

@media (max-width: 480px) {
  main {
    padding: 16px 8px 40px;
  }

  .card {
    padding: 9px;
    border-radius: 17px;
  }

  #crossword {
    min-width: 350px;
    gap: 1px;
    padding: 5px;
  }

  .cell input {
    font-size: .92rem;
  }
}
</style>
</head>

<body>
<main>

  <header class="hero">
    <div class="kicker">How well do you know the family?</div>
    <h1>Family Crossword</h1>
    <p class="subtitle">
      Tap a clue or a square and type your answers. When an entire answer is correct,
      that word lights up yellow.
    </p>
  </header>

  <section class="layout">

    <div class="card game-card">
      <div class="status-row">
        <div id="score" class="score">0 / 13 solved</div>
        <div class="instructions">Answers ignore spaces.</div>
      </div>

      <div class="grid-wrap">
        <div id="crossword" aria-label="Family crossword puzzle"></div>
      </div>

      <div class="controls">
        <button id="clearButton" class="action" type="button">Clear Puzzle</button>
        <button id="checkButton" class="action primary" type="button">Check Puzzle</button>
      </div>

      <div id="message" aria-live="polite">Pick a clue and start typing.</div>
      <div id="win" class="win">🎉 FAMILY CROSSWORD COMPLETE! 🎉</div>
    </div>

    <aside class="card clues-card">
      <h2>Clues</h2>

      <section class="clue-section">
        <div class="clue-title">Across</div>
        <div id="acrossClues" class="clue-list"></div>
      </section>

      <section class="clue-section">
        <div class="clue-title">Down</div>
        <div id="downClues" class="clue-list"></div>
      </section>
    </aside>

  </section>

</main>

<script>
(() => {
  const ROWS = 16;
  const COLS = 13;

  const ENTRIES = [{"id": "1", "number": 1, "direction": "down", "answer": "KAWASAKI", "clue": "Manufacturer of Joey's bike", "row": 3, "col": 3}, {"id": "3", "number": 3, "direction": "down", "answer": "VUKSTA", "clue": "Mimi's maiden last name", "row": 5, "col": 0}, {"id": "5", "number": 5, "direction": "down", "answer": "ADAM", "clue": "Should have been born in Brazil", "row": 12, "col": 8}, {"id": "7", "number": 7, "direction": "down", "answer": "ADDIE", "clue": "Loves Bluey", "row": 0, "col": 8}, {"id": "9", "number": 9, "direction": "down", "answer": "EMMETT", "clue": "Throws a mean spiral", "row": 1, "col": 6}, {"id": "11", "number": 11, "direction": "down", "answer": "JOEY", "clue": "Tallest", "row": 9, "col": 5}, {"id": "13", "number": 13, "direction": "down", "answer": "BUFORD", "clue": "Where we moved to in 1999", "row": 6, "col": 9}, {"id": "2", "number": 2, "direction": "across", "answer": "ALYSSA", "clue": "The oldest kid", "row": 12, "col": 3}, {"id": "4", "number": 4, "direction": "across", "answer": "ALLISONPARK", "clue": "City name in Pittsburgh", "row": 10, "col": 0}, {"id": "6", "number": 6, "direction": "across", "answer": "CINCINNATI", "clue": "Where Joey and I were born", "row": 14, "col": 1}, {"id": "8", "number": 8, "direction": "across", "answer": "LAUREN", "clue": "Loves animals", "row": 0, "col": 7}, {"id": "10", "number": 10, "direction": "across", "answer": "MAPLELEAF", "clue": "Street name in Cincinnati", "row": 4, "col": 2}, {"id": "12", "number": 12, "direction": "across", "answer": "BLUE", "clue": "Addie and Emmett's eyes", "row": 1, "col": 3}];

  const crossword = document.getElementById("crossword");
  const acrossClues = document.getElementById("acrossClues");
  const downClues = document.getElementById("downClues");
  const score = document.getElementById("score");
  const message = document.getElementById("message");
  const win = document.getElementById("win");
  const clearButton = document.getElementById("clearButton");
  const checkButton = document.getElementById("checkButton");

  const cellMap = new Map();
  const inputMap = new Map();
  const entryCells = new Map();
  const cellEntries = new Map();
  const clueButtons = new Map();

  let activeEntryId = null;

  function key(row, col) {
    return row + "," + col;
  }

  function buildPuzzleData() {
    for (const entry of ENTRIES) {
      const cells = [];
      const rowStep = entry.direction === "down" ? 1 : 0;
      const colStep = entry.direction === "across" ? 1 : 0;

      for (let i = 0; i < entry.answer.length; i++) {
        const row = entry.row + rowStep * i;
        const col = entry.col + colStep * i;
        const cellKey = key(row, col);

        cells.push(cellKey);

        if (!cellEntries.has(cellKey)) {
          cellEntries.set(cellKey, []);
        }

        cellEntries.get(cellKey).push(entry.id);
      }

      entryCells.set(entry.id, cells);
    }
  }

  function startNumbers() {
    const numbers = new Map();

    for (const entry of ENTRIES) {
      const cellKey = key(entry.row, entry.col);

      if (!numbers.has(cellKey)) {
        numbers.set(cellKey, []);
      }

      numbers.get(cellKey).push(entry.number);
    }

    return numbers;
  }

  function renderGrid() {
    crossword.innerHTML = "";
    const numbers = startNumbers();

    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const cellKey = key(row, col);
        const holder = document.createElement("div");
        holder.className = "cell";
        holder.dataset.key = cellKey;

        if (!cellEntries.has(cellKey)) {
          holder.classList.add("block");
          crossword.appendChild(holder);
          continue;
        }

        if (numbers.has(cellKey)) {
          const number = document.createElement("span");
          number.className = "number";
          number.textContent = numbers.get(cellKey).join("/");
          holder.appendChild(number);
        }

        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "text";
        input.autocomplete = "off";
        input.autocapitalize = "characters";
        input.spellcheck = false;
        input.maxLength = 1;
        input.setAttribute("aria-label", "Crossword square");

        input.addEventListener("focus", () => {
          chooseEntryForCell(cellKey);
          paintActiveEntry();
        });

        input.addEventListener("click", () => {
          chooseEntryForCell(cellKey, true);
          paintActiveEntry();
        });

        input.addEventListener("input", event => {
          const clean = event.target.value
            .toUpperCase()
            .replace(/[^A-Z]/g, "")
            .slice(-1);

          event.target.value = clean;
          updateCorrectness();

          if (clean) {
            moveWithinActiveEntry(cellKey, 1);
          }
        });

        input.addEventListener("keydown", event => {
          if (event.key === "Backspace" && input.value === "") {
            event.preventDefault();
            moveWithinActiveEntry(cellKey, -1, true);
            return;
          }

          if (event.key === "ArrowRight") {
            event.preventDefault();
            movePhysical(row, col + 1);
          }
          else if (event.key === "ArrowLeft") {
            event.preventDefault();
            movePhysical(row, col - 1);
          }
          else if (event.key === "ArrowDown") {
            event.preventDefault();
            movePhysical(row + 1, col);
          }
          else if (event.key === "ArrowUp") {
            event.preventDefault();
            movePhysical(row - 1, col);
          }
        });

        holder.appendChild(input);
        crossword.appendChild(holder);

        cellMap.set(cellKey, holder);
        inputMap.set(cellKey, input);
      }
    }
  }

  function renderClues() {
    acrossClues.innerHTML = "";
    downClues.innerHTML = "";

    const across = ENTRIES
      .filter(entry => entry.direction === "across")
      .sort((a, b) => a.number - b.number);

    const down = ENTRIES
      .filter(entry => entry.direction === "down")
      .sort((a, b) => a.number - b.number);

    for (const entry of [...across, ...down]) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "clue";
      button.dataset.entryId = entry.id;

      button.innerHTML =
        '<span class="clue-number">' + entry.number + '</span>' +
        '<span class="clue-text">' + escapeHTML(entry.clue) + '</span>';

      button.addEventListener("click", () => {
        activeEntryId = entry.id;
        paintActiveEntry();

        const firstCell = entryCells.get(entry.id)[0];
        const input = inputMap.get(firstCell);

        if (input) {
          input.focus();
        }
      });

      clueButtons.set(entry.id, button);

      if (entry.direction === "across") {
        acrossClues.appendChild(button);
      }
      else {
        downClues.appendChild(button);
      }
    }
  }

  function escapeHTML(text) {
    return text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function chooseEntryForCell(cellKey, toggle = false) {
    const ids = cellEntries.get(cellKey) || [];

    if (ids.length === 0) {
      return;
    }

    if (ids.length === 1) {
      activeEntryId = ids[0];
      return;
    }

    if (activeEntryId && ids.includes(activeEntryId) && !toggle) {
      return;
    }

    if (toggle && activeEntryId && ids.includes(activeEntryId)) {
      const index = ids.indexOf(activeEntryId);
      activeEntryId = ids[(index + 1) % ids.length];
      return;
    }

    activeEntryId = ids[0];
  }

  function paintActiveEntry() {
    document
      .querySelectorAll(".cell.active")
      .forEach(cell => cell.classList.remove("active"));

    document
      .querySelectorAll(".clue.selected")
      .forEach(clue => clue.classList.remove("selected"));

    if (!activeEntryId) {
      return;
    }

    const cells = entryCells.get(activeEntryId) || [];

    for (const cellKey of cells) {
      const cell = cellMap.get(cellKey);
      if (cell) {
        cell.classList.add("active");
      }
    }

    const clue = clueButtons.get(activeEntryId);
    if (clue) {
      clue.classList.add("selected");
    }
  }

  function moveWithinActiveEntry(currentCellKey, amount, deletePrevious = false) {
    if (!activeEntryId) {
      return;
    }

    const cells = entryCells.get(activeEntryId) || [];
    const index = cells.indexOf(currentCellKey);

    if (index === -1) {
      return;
    }

    const nextIndex = index + amount;

    if (nextIndex < 0 || nextIndex >= cells.length) {
      return;
    }

    const nextInput = inputMap.get(cells[nextIndex]);

    if (nextInput) {
      nextInput.focus();

      if (deletePrevious) {
        nextInput.value = "";
        updateCorrectness();
      }
    }
  }

  function movePhysical(row, col) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) {
      return;
    }

    const input = inputMap.get(key(row, col));
    if (input) {
      input.focus();
    }
  }

  function entryIsCorrect(entry) {
    const cells = entryCells.get(entry.id);

    if (!cells) {
      return false;
    }

    const typed = cells
      .map(cellKey => {
        const input = inputMap.get(cellKey);
        return input ? input.value.toUpperCase() : "";
      })
      .join("");

    return typed === entry.answer;
  }

  function updateCorrectness(showCheckMessage = false) {
    const correctEntries = new Set(
      ENTRIES
        .filter(entry => entryIsCorrect(entry))
        .map(entry => entry.id)
    );

    for (const [cellKey, cell] of cellMap.entries()) {
      const ids = cellEntries.get(cellKey) || [];
      const belongsToCorrectWord = ids.some(id => correctEntries.has(id));
      cell.classList.toggle("correct", belongsToCorrectWord);
    }

    for (const entry of ENTRIES) {
      const clue = clueButtons.get(entry.id);
      if (clue) {
        clue.classList.toggle("correct", correctEntries.has(entry.id));
      }
    }

    const solved = correctEntries.size;
    score.textContent =
      solved + " / " + ENTRIES.length +
      (ENTRIES.length === 1 ? " solved" : " solved");

    if (solved === ENTRIES.length) {
      win.classList.add("show");
      message.textContent = "You got every answer. Nice work. 🔥";
      message.className = "good";
    }
    else {
      win.classList.remove("show");

      if (showCheckMessage) {
        if (solved === 0) {
          message.textContent = "Nothing complete yet. Keep going.";
        }
        else {
          message.textContent =
            solved + " answer" +
            (solved === 1 ? " is" : "s are") +
            " correct so far.";
        }

        message.className = solved > 0 ? "good" : "";
      }
    }
  }

  clearButton.addEventListener("click", () => {
    for (const input of inputMap.values()) {
      input.value = "";
    }

    activeEntryId = null;
    paintActiveEntry();
    updateCorrectness();

    message.textContent = "Puzzle cleared. Start again.";
    message.className = "";

    const firstEntry = ENTRIES.find(entry => entry.number === 1) || ENTRIES[0];
    const firstInput = inputMap.get(entryCells.get(firstEntry.id)[0]);

    if (firstInput) {
      firstInput.focus();
    }
  });

  checkButton.addEventListener("click", () => {
    updateCorrectness(true);
  });

  buildPuzzleData();
  renderGrid();
  renderClues();
  updateCorrectness();
})();
</script>

</body>
</html>

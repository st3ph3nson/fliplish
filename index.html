<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elefen Lector — Tap to Define</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #38bdf8;
      --highlight-bg: rgba(56, 189, 248, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 120px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-title span {
      color: var(--highlight);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .story-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .story-selector::-webkit-scrollbar {
      display: none;
    }

    .story-tab {
      background-color: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .story-tab.active {
      background-color: var(--primary);
      border-color: var(--highlight);
      color: #ffffff;
    }

    .reader-card {
      background-color: #ffffff;
      color: #0f172a;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .story-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .story-tag {
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .story-hint {
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748b;
    }

    .story-title {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 18px;
      color: #0b2545;
    }

    .story-content {
      font-size: 1.15rem;
      line-height: 1.85;
      font-family: -apple-system, BlinkMacSystemFont, "Georgia", serif;
      color: #1e293b;
    }

    .word {
      cursor: pointer;
      padding: 2px 3px;
      margin: 0 -1px;
      border-radius: 4px;
      transition: background-color 0.15s, color 0.15s;
    }

    .word:hover {
      background-color: #e2e8f0;
    }

    .word.selected {
      background-color: #0284c7;
      color: #ffffff !important;
      font-weight: 600;
    }

    .translation-box {
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }

    .translation-toggle {
      background: none;
      border: none;
      color: #0284c7;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .translation-text {
      display: none;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #64748b;
      margin-top: 10px;
      font-style: italic;
    }

    #definition-sheet {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(150%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    #definition-sheet.visible {
      transform: translateX(-50%) translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .sheet-word {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ffffff;
    }

    .sheet-pos {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(56, 189, 248, 0.15);
      color: var(--highlight);
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }

    .sheet-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 4px;
    }

    .sheet-def {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .sheet-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">
        <h1>Elefen Lector</h1>
        <span>Tap any word to translate</span>
      </div>
    </header>

    <div class="story-selector" id="story-tabs"></div>

    <div class="reader-card">
      <div class="story-meta">
        <span class="story-tag" id="story-category">CONTO</span>
        <span class="story-hint">👆 Toce un parola</span>
      </div>
      <h2 class="story-title" id="story-title"></h2>
      <div class="story-content" id="story-body"></div>

      <div class="translation-box">
        <button class="translation-toggle" id="toggle-translation">
          <span>📖 Mostra tradui completa</span>
        </button>
        <div class="translation-text" id="story-translation"></div>
      </div>
    </div>
  </div>

  <div id="definition-sheet">
    <div class="sheet-header">
      <div>
        <span class="sheet-word" id="def-word">Parola</span>
        <span class="sheet-pos" id="def-pos">POS</span>
      </div>
      <button class="sheet-close" id="close-sheet">✕</button>
    </div>
    <div class="sheet-def" id="def-meaning">English translation goes here.</div>
    <div class="sheet-note" id="def-note">Example note.</div>
  </div>

  <script>
    const DICTIONARY = {
      "un": { def: "a, an, one", pos: "article" },
      "viajor": { def: "traveler", pos: "noun" },
      "joven": { def: "young", pos: "adj" },
      "ia": { def: "[past tense marker]", pos: "particle", note: "Shows past action: 'ia ariva' = arrived" },
      "ariva": { def: "to arrive", pos: "verb" },
      "a": { def: "at, to", pos: "prep" },
      "la": { def: "the", pos: "article" },
      "sera": { def: "evening", pos: "noun" },
      "sol": { def: "sun", pos: "noun" },
      "reposa": { def: "to rest, set", pos: "verb" },
      "sur": { def: "on, upon", pos: "prep" },
      "mar": { def: "sea, ocean", pos: "noun" },
      "briliante": { def: "shining, brilliant", pos: "adj" },
      "e": { def: "and", pos: "conj" },
      "aira": { def: "air, breeze", pos: "noun" },
      "es": { def: "to be (is, are, was)", pos: "verb" },
      "dulse": { def: "sweet, gentle", pos: "adj" },
      "calma": { def: "calm, quiet", pos: "adj" },
      "el": { def: "he, she, it (person)", pos: "pronoun" },
      "pasea": { def: "to stroll, walk", pos: "verb" },
      "tra": { def: "through, across", pos: "prep" },
      "stradas": { def: "streets (plural)", pos: "noun", note: "Root: strada" },
      "strada": { def: "street, road", pos: "noun" },
      "de": { def: "of, from", pos: "prep" },
      "petra": { def: "stone, rock", pos: "noun" },
      "regardante": { def: "watching, looking at", pos: "participle", note: "regarda + -nte" },
      "regarda": { def: "to look at, watch", pos: "verb" },
      "cafes": { def: "cafés (plural)", pos: "noun" },
      "plen": { def: "full", pos: "adj" },
      "persones": { def: "people, persons", pos: "noun" },
      "ci": { def: "who, which", pos: "pronoun" },
      "parla": { def: "to talk, speak", pos: "verb" },
      "ridi": { def: "to laugh", pos: "verb" },
      "con": { def: "with", pos: "prep" },
      "joia": { def: "joy, delight", pos: "noun" },
      "pronto": { def: "soon, quickly", pos: "adv" },
      "trova": { def: "to find, discover", pos: "verb" },
      "libreria": { def: "bookstore, library", pos: "noun" },
      "vea": { def: "old, ancient", pos: "adj" },
      "sinia": { def: "sign, signal", pos: "noun" },
      "lenio": { def: "wood", pos: "noun" },
      "libres": { def: "books (plural)", pos: "noun" },
      "libre": { def: "book", pos: "noun" },
      "cuando": { def: "when", pos: "conj" },
      "entra": { def: "to enter", pos: "verb" },
      "gato": { def: "cat", pos: "noun" },
      "gris": { def: "gray", pos: "adj" },
      "saluta": { def: "to greet, salute", pos: "verb" },
      "miaula": { def: "meow", pos: "noun" },
      "porto": { def: "port, harbor", pos: "noun" },
      "elefen": { def: "Lingua Franca Nova", pos: "proper noun" },
      "santos": { def: "Santos (city)", pos: "proper noun" },
      "autovia": { def: "highway, motorway", pos: "noun" },
      "entre": { def: "between, among", pos: "prep" },
      "tempo": { def: "weather, time", pos: "noun" },
      "bon": { def: "good", pos: "adj" },
      "dia": { def: "day", pos: "noun" },
      "doman": { def: "tomorrow", pos: "adv" },
      "va": { def: "[future tense marker]", pos: "particle", note: "Shows future action: 'va es' = will be" },
      "transmeteda": { def: "broadcasted, transmitted", pos: "adj / part" },
      "par": { def: "by", pos: "prep" },
      "canal": { def: "channel, canal", pos: "noun" },
      "lago": { def: "lake", pos: "noun" },
      "serena": { def: "serene, peaceful", pos: "adj" },
      "fronti": { def: "to face, confront", pos: "verb" },
      "sportal": { def: "sporting, athletic", pos: "adj" }
    };

    const STORIES = [
      {
        id: "libreria",
        tab: "La Libreria Vea",
        category: "CONTO",
        title: "La Libreria Vea en Porto de Elefen",
        text: "Un viajor joven ia ariva a Porto de Elefen a la sera. La sol ia reposa sur la mar briliante, e la aira ia es dulse e calma. El ia pasea tra la stradas de petra, regardante la cafes plen de persones ci ia parla e ridi con joia. Pronto, el ia trova un libreria vea con un sinia de lenio: Libres de la Mar. Cuando el ia entra, un gato gris ia saluta el con un miaula dulse.",
        translation: "A young traveler arrived in Porto de Elefen in the evening. The sun was resting on the shining sea, and the air was sweet and calm. He strolled through the stone streets, watching the cafés full of people who were talking and laughing with joy. Soon, he found an old bookstore with a wooden sign: 'Books of the Sea'. When he entered, a gray cat greeted him with a gentle meow."
      },
      {
        id: "matce",
        tab: "La Partico Grande",
        category: "SPORTE",
        title: "La Partico entre Porto e Lago Serena",
        text: "Porto de Elefen va fronti Lago Serena doman a la sera. La evento va es transmeteda par Canal 26 Elefen. Tota la persones en la site parla con joia sur la juores e la stadion nova.",
        translation: "Porto de Elefen will face Lago Serena tomorrow in the evening. The event will be broadcasted by Canal 26 Elefen. All the people in the city are talking with joy about the players and the new stadium."
      }
    ];

    let currentStoryIndex = 0;
    let selectedWordSpan = null;

    const storyTabsContainer = document.getElementById('story-tabs');
    const storyCategory = document.getElementById('story-category');
    const storyTitle = document.getElementById('story-title');
    const storyBody = document.getElementById('story-body');
    const storyTranslation = document.getElementById('story-translation');
    const toggleTranslationBtn = document.getElementById('toggle-translation');

    const defSheet = document.getElementById('definition-sheet');
    const defWord = document.getElementById('def-word');
    const defPos = document.getElementById('def-pos');
    const defMeaning = document.getElementById('def-meaning');
    const defNote = document.getElementById('def-note');
    const closeSheetBtn = document.getElementById('close-sheet');

    function initTabs() {
      storyTabsContainer.innerHTML = '';
      STORIES.forEach((story, idx) => {
        const btn = document.createElement('button');
        btn.className = `story-tab ${idx === currentStoryIndex ? 'active' : ''}`;
        btn.textContent = story.tab;
        btn.addEventListener('click', () => loadStory(idx));
        storyTabsContainer.appendChild(btn);
      });
    }

    function renderInteractiveText(text) {
      const tokens = text.split(/([a-zA-ZÀ-ÿ0-9_]+)/);
      const frag = document.createDocumentFragment();

      tokens.forEach(token => {
        if (/^[a-zA-ZÀ-ÿ0-9_]+$/.test(token)) {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = token;
          span.setAttribute('data-clean', token.toLowerCase());
          span.addEventListener('click', (e) => handleWordClick(e, span, token));
          frag.appendChild(span);
        } else {
          frag.appendChild(document.createTextNode(token));
        }
      });

      return frag;
    }

    function loadStory(idx) {
      currentStoryIndex = idx;
      const story = STORIES[idx];

      document.querySelectorAll('.story-tab').forEach((tab, i) => {
        tab.classList.toggle('active', i === idx);
      });

      storyCategory.textContent = story.category;
      storyTitle.textContent = story.title;
      storyBody.innerHTML = '';
      storyBody.appendChild(renderInteractiveText(story.text));
      storyTranslation.textContent = story.translation;
      storyTranslation.style.display = 'none';
      toggleTranslationBtn.querySelector('span').textContent = '📖 Mostra tradui completa';

      hideDefinition();
    }

    function handleWordClick(e, span, rawWord) {
      if (selectedWordSpan) {
        selectedWordSpan.classList.remove('selected');
      }

      selectedWordSpan = span;
      selectedWordSpan.classList.add('selected');

      const cleanWord = rawWord.toLowerCase();
      lookupWord(cleanWord, rawWord);
    }

    function lookupWord(clean, original) {
      let entry = DICTIONARY[clean];

      if (!entry && clean.endsWith('s')) {
        const singular = clean.slice(0, -1);
        if (DICTIONARY[singular]) {
          entry = {
            ...DICTIONARY[singular],
            def: DICTIONARY[singular].def + " (plural)",
            note: "Plural form of '" + singular + "'"
          };
        }
      }

      defWord.textContent = original;

      if (entry) {
        defPos.textContent = entry.pos || 'VOCAB';
        defPos.style.display = 'inline-block';
        defMeaning.textContent = entry.def;
        defNote.textContent = entry.note || '';
        defNote.style.display = entry.note ? 'block' : 'none';
      } else {
        defPos.style.display = 'none';
        defMeaning.textContent = 'Definition not in quick dictionary.';
        defNote.textContent = 'Tap another word or add this to your dictionary list.';
        defNote.style.display = 'block';
      }

      defSheet.classList.add('visible');
    }

    function hideDefinition() {
      defSheet.classList.remove('visible');
      if (selectedWordSpan) {
        selectedWordSpan.classList.remove('selected');
        selectedWordSpan = null;
      }
    }

    closeSheetBtn.addEventListener('click', hideDefinition);

    toggleTranslationBtn.addEventListener('click', () => {
      const isHidden = storyTranslation.style.display === 'none';
      storyTranslation.style.display = isHidden ? 'block' : 'none';
      toggleTranslationBtn.querySelector('span').textContent = isHidden ? '✕ Asconde tradui' : '📖 Mostra tradui completa';
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.word') && !e.target.closest('#definition-sheet')) {
        hideDefinition();
      }
    });

    initTabs();
    loadStory(0);
  </script>
</body>
</html>
